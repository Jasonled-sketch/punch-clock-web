<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head><body>
<title>譽昇神明島</title>
<style>
/* Layout: full-bleed 3D clay city; floating paper panels pinned to the corners (brand+card left, list right, HUD pill bottom). */
:root{
  --coral:#db6a41; --ink:#211d1d; --cream:#fff8f4; --yellow:#fcea8b; --stone:#c5b5a7; --green:#71806a;
  --teal:#3e7c8c; --muted:#6f625b; --line:rgba(33,29,29,.10);
  --paper:rgba(255,250,246,.86); --paper-solid:#fffaf6; --glass:rgba(255,250,246,.72);
  --shadow:0 1px 2px #4a2a1410,0 6px 16px #4a2a1414,0 22px 48px #4a2a141f;
  --chip-shadow:0 2px 8px #4a2a1414;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --num:Georgia,"Times New Roman",serif;
  --sideW:318px; --cardW:340px; --hudH:76px;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px);
  color-scheme:light;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:radial-gradient(130% 100% at 50% 28%,#fffdf9 0%,#f6ece2 55%,#edddcf 100%);color:var(--ink);font-family:var(--font);overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0;overflow:hidden}
#stage{position:absolute;inset:0;touch-action:none;cursor:grab}
#stage:active{cursor:grabbing}
#stage canvas{display:block;width:100%!important;height:100%!important;outline:none}
#labels{position:absolute;inset:0;pointer-events:none;z-index:2;overflow:hidden}
button{font:inherit;color:inherit}
.eyebrow{font:700 10px/1.2 var(--mono);letter-spacing:2px;text-transform:uppercase;color:var(--coral)}
.muted{color:var(--muted)}

/* ---------- buttons & chips ---------- */
.btn{min-height:44px;min-width:44px;border:0;border-radius:9px;background:transparent;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;font-size:13px;font-weight:600;transition:background .15s,color .15s,transform .1s}
.btn:hover{background:var(--yellow)}
.btn[aria-pressed="true"],.btn.on{background:var(--ink);color:var(--cream)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible,.chip:focus-visible,.ilabel:focus-visible,summary:focus-visible,.item-row:focus-visible,input:focus-visible,.seal:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.btn.solid{background:var(--coral);color:#fff}
.btn.solid:hover{background:#c85c35}
.btn.ghost{background:#fff;box-shadow:var(--chip-shadow)}
.btn svg{width:20px;height:20px;flex:none}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;background:#fff;border:0;padding:6px 12px;font-size:12px;font-weight:600;box-shadow:var(--chip-shadow);cursor:pointer;min-height:32px}
.chip.cream{background:var(--cream)}
.chip:hover{background:var(--yellow)}
.chip i{font-style:normal;font:700 10px var(--mono);color:var(--coral)}

/* ---------- left column ---------- */
#leftCol{position:absolute;z-index:6;top:calc(16px + var(--st));left:calc(16px + var(--sl));bottom:calc(var(--hudH) + 32px + var(--sb));width:var(--cardW);display:flex;flex-direction:column;gap:10px;pointer-events:none}
#leftCol>*{pointer-events:auto}
.brand{background:var(--glass);backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);border:1px solid rgba(255,255,255,.75);border-radius:18px;box-shadow:var(--shadow);padding:14px 16px 12px;display:grid;gap:8px}
.brand-row{display:flex;align-items:center;gap:12px}
.brand-mark{width:44px;height:44px;border-radius:12px;background:var(--coral);color:#fff;display:grid;place-items:center;font-weight:900;font-size:22px;box-shadow:inset 0 -3px 0 #0002;flex:none}
.brand h1{margin:0;font-size:24px;line-height:1.05;font-weight:900;letter-spacing:1px}
.brand h1 small{display:inline-block;margin-left:6px;font-size:13px;font-weight:700;background:var(--ink);color:var(--cream);border-radius:999px;padding:3px 9px;vertical-align:4px;letter-spacing:2px}
.brand p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.seals{display:grid;grid-template-columns:repeat(12,1fr);gap:4px}
.seal{aspect-ratio:1;border-radius:5px;border:1.5px dashed #c9b3a3;background:transparent;display:grid;place-items:center;font-size:11px;font-weight:800;color:#b7a294;cursor:pointer;padding:0}
.seal.got{border:1.5px solid var(--coral);background:var(--coral);color:#fff;transform:rotate(-4deg)}
.seal-meta{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted)}
.seal-meta b{font:italic 700 15px var(--num);color:var(--ink)}
.tools{display:flex;gap:6px;align-self:flex-start;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:14px;padding:5px;box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.75)}
.tools .btn{flex-direction:column;gap:2px;font-size:11px;padding:4px 10px;min-width:52px}

/* ---------- detail card ---------- */
.card{background:var(--paper);backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);border-radius:22px;box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.8);min-height:0;flex:0 1 auto;display:flex;flex-direction:column;overflow:hidden}
.card-scroll{overflow:auto;padding:18px 18px 20px;display:grid;gap:14px;overscroll-behavior:contain}
.card-close{position:absolute;top:10px;right:10px;z-index:2}
.card-head{display:flex;gap:12px;align-items:flex-start;padding-right:40px}
.card-icon{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;color:#fff;font-weight:900;font-size:26px;flex:none;box-shadow:inset 0 -4px 0 #0002}
.card h2{margin:2px 0 0;font-size:21px;line-height:1.2;text-wrap:balance}
.card h3{margin:0;font-size:13px;letter-spacing:1px}
.card p{margin:0;font-size:14px;line-height:1.65}
.thumb{width:100%;aspect-ratio:1.6;border-radius:16px;background:radial-gradient(circle at 50% 70%,#fff,#f1e4d6);display:grid;place-items:center;overflow:hidden}
.thumb img{width:160px;height:160px;max-width:100%}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}
.stat{background:#fff;border-radius:14px;padding:10px 10px 9px;box-shadow:var(--chip-shadow);min-width:0}
.stat b{display:block;font:italic 700 26px/1 var(--num);color:var(--coral);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat span{display:block;margin-top:4px;font-size:11px;line-height:1.35;color:var(--muted)}
.facts{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.facts li{font-size:13px;line-height:1.55;padding-left:14px;position:relative}
.facts li::before{content:"";position:absolute;left:2px;top:.62em;width:6px;height:6px;border-radius:2px;background:var(--coral);transform:rotate(45deg)}
.timeline{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;position:relative}
.timeline div{font-size:11px;text-align:center;padding:16px 2px 0;position:relative;color:var(--muted)}
.timeline div::before{content:"";position:absolute;top:4px;left:0;right:0;height:4px;background:#eadccf;border-radius:4px}
.timeline div::after{content:"";position:absolute;top:0;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:#fff;border:2px solid #d8c4b4}
.timeline div.on{color:var(--ink);font-weight:800}
.timeline div.on::before{background:var(--coral)}
.timeline div.on::after{background:var(--coral);border-color:#fff;box-shadow:0 0 0 3px #db6a4133}
.item-list{display:grid;gap:4px;margin:0;padding:0;list-style:none}
.item-row{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:transparent;border-radius:10px;padding:8px;cursor:pointer;font-size:14px;min-height:44px}
.item-row:hover{background:var(--yellow)}
.item-row .n{width:22px;height:22px;border-radius:50%;background:var(--coral);color:#fff;display:grid;place-items:center;font:700 12px var(--mono);flex:none}
.item-row .lit{margin-left:auto;font:700 9px var(--mono);letter-spacing:1px;background:var(--yellow);border-radius:999px;padding:2px 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.ritual{background:linear-gradient(135deg,#fff3ea,#ffe9d9);border-radius:16px;padding:14px;display:grid;gap:10px;border:1px solid #f3d3be}
.ritual-row{display:flex;align-items:center;gap:10px;justify-content:space-between}
.flowline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:800;font-size:16px}
.flowline .arrow{color:var(--coral);font-family:var(--mono)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600}
.lvl{display:inline-flex;align-items:center;gap:6px}
.lvl svg{width:34px;height:8px}

/* ---------- side list ---------- */
#side{position:absolute;z-index:6;top:calc(16px + var(--st));right:calc(16px + var(--sr));bottom:calc(var(--hudH) + 32px + var(--sb));width:var(--sideW);background:rgba(255,250,246,.7);backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2);border-radius:22px;box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.75);display:flex;flex-direction:column;overflow:hidden}
.side-head{padding:14px 14px 8px;display:grid;gap:10px}
.search{display:flex;align-items:center;gap:8px;background:#fff;border-radius:12px;padding:0 12px;box-shadow:var(--chip-shadow)}
.search input{flex:1;border:0;background:transparent;min-height:42px;font:inherit;font-size:14px;outline:none;min-width:0}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:#efe3d8;border-radius:11px;padding:3px;gap:3px}
.tabs .btn{min-height:38px;font-size:13px}
.side-body{overflow:auto;padding:4px 10px 14px;overscroll-behavior:contain}
.side-body details{border-radius:12px;margin-bottom:4px}
.side-body details[open]{background:rgba(255,255,255,.6)}
.side-body summary{list-style:none;display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;cursor:pointer;min-height:44px}
.side-body summary::-webkit-details-marker{display:none}
.side-body summary:hover{background:var(--yellow)}
.side-body summary .ic{width:30px;height:30px;border-radius:9px;color:#fff;display:grid;place-items:center;font-weight:900;font-size:15px;flex:none}
.side-body summary .t{display:grid;line-height:1.25;min-width:0}
.side-body summary .t b{font-size:14px}
.side-body summary .t span{font-size:11px;color:var(--muted)}
.side-body summary .no{margin-left:auto;font:700 10px var(--mono);color:var(--muted)}
.side-body .item-row{padding:6px 8px 6px 14px;min-height:40px;font-size:13px}
.flow-row{display:grid;gap:4px;width:100%;text-align:left;border:0;background:transparent;border-radius:12px;padding:10px;cursor:pointer;min-height:44px}
.flow-row:hover{background:var(--yellow)}
.flow-row b{font-size:13px}
.flow-row span{font-size:12px;color:var(--muted)}
.empty{padding:20px;text-align:center;color:var(--muted);font-size:13px}

/* ---------- HUD ---------- */
#hud{position:absolute;z-index:7;left:50%;bottom:calc(16px + var(--sb));transform:translateX(-50%);display:flex;align-items:center;gap:4px;background:rgba(255,250,246,.86);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:999px;padding:6px 8px;box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.8);max-width:calc(100% - 32px)}
#hud .btn{flex-direction:column;gap:1px;font-size:11px;padding:3px 8px;min-width:50px;border-radius:999px}
#hud .sep{width:1px;align-self:stretch;margin:6px 4px;background:var(--line)}
.clock{display:grid;justify-items:center;padding:0 10px;min-width:84px}
.clock b{font:italic 700 24px/1 var(--num);font-variant-numeric:tabular-nums}
.clock span{font-size:10px;color:var(--muted);white-space:nowrap;max-width:96px;overflow:hidden;text-overflow:ellipsis}
#timeBtn{display:none}

/* ---------- log ---------- */
#log{position:absolute;z-index:6;top:calc(16px + var(--st));right:calc(16px + var(--sr));width:300px;max-height:44%;display:flex;flex-direction:column;background:rgba(255,250,246,.86);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:18px;box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.8);overflow:hidden}
#app.side-open #log{right:calc(var(--sideW) + 32px + var(--sr))}
.log-head{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.log-head h3{margin:0;font-size:14px}
.live{display:inline-flex;align-items:center;gap:5px;font:700 10px var(--mono);letter-spacing:1px;color:#2f8a4f}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:#35b26a;box-shadow:0 0 0 0 #35b26a88;animation:pulse 1.6s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 7px #35b26a00}100%{box-shadow:0 0 0 0 #35b26a00}}
.log-head select{margin-left:auto;font:inherit;font-size:12px;border:0;background:#fff;border-radius:8px;padding:6px 8px;box-shadow:var(--chip-shadow);max-width:130px}
.log-list{overflow:auto;margin:0;padding:6px 12px 10px;list-style:none;display:grid;gap:2px}
.log-list li{font-size:12px;line-height:1.5;padding:4px 0;border-bottom:1px dashed var(--line);display:grid;grid-template-columns:auto 1fr;gap:8px}
.log-list time{font:700 11px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.log-list .k{font:700 9px var(--mono);letter-spacing:1px;border-radius:4px;padding:1px 4px;margin-right:4px}
.k.depart{background:#e4eef7;color:#3a6a95}.k.arrive{background:#e5f2e6;color:#3b7a46}.k.handoff{background:#fde5da;color:#b04a25}

/* ---------- legend ---------- */
#legend{position:absolute;z-index:6;left:50%;transform:translateX(-50%);bottom:calc(var(--hudH) + 30px + var(--sb));display:flex;gap:14px;align-items:center;background:rgba(255,250,246,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:999px;padding:6px 14px;box-shadow:var(--chip-shadow);font-size:12px;font-weight:600;white-space:nowrap}

/* ---------- 3D labels ---------- */
.ilabel{pointer-events:auto;display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;background:var(--cream);color:var(--ink);padding:5px 11px 5px 6px;font-size:13px;font-weight:800;box-shadow:0 2px 0 #0000000d,0 4px 12px #4a2a1426;cursor:pointer;white-space:nowrap;transition:opacity .25s,background .2s,color .2s;margin-bottom:6px}
.ilabel .no{font:700 10px var(--mono);background:var(--coral);color:#fff;border-radius:999px;padding:3px 6px;letter-spacing:.5px}
.ilabel.sel{background:var(--ink);color:var(--cream)}
.ilabel.dim{opacity:.45}
.ilabel.compact .nm{display:none}
.ilabel.compact{padding-right:6px}
.ilabel.hide,.pin.hide{opacity:0;pointer-events:none}
.pin{pointer-events:auto;width:24px;height:24px;border-radius:50%;background:var(--coral);color:#fff;border:2px solid #fff;font:700 12px var(--mono);display:grid;place-items:center;box-shadow:0 3px 10px #4a2a1440;cursor:pointer;padding:0;transition:opacity .2s}
.pin.lit{background:#e8b923;color:var(--ink)}
.bubble{background:#fff;border-radius:10px;padding:3px 8px;font-size:11px;font-weight:700;box-shadow:0 2px 8px #4a2a1430;white-space:nowrap;margin-bottom:4px;position:relative}
.bubble::after{content:"";position:absolute;left:50%;bottom:-4px;margin-left:-4px;border:4px solid transparent;border-bottom:0;border-top-color:#fff}

/* ---------- overlays ---------- */
.overlay{position:absolute;inset:0;z-index:20;display:grid;place-items:center;padding:20px;background:rgba(237,221,207,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#loading{background:radial-gradient(130% 100% at 50% 28%,#fffdf9,#edddcf);transition:opacity .6s}
#loading.fade{opacity:0;pointer-events:none}
.load-box{text-align:center;display:grid;gap:14px;justify-items:center;max-width:460px}
.load-seal{width:92px;height:92px;border-radius:22px;background:var(--coral);color:#fff;font-size:46px;font-weight:900;display:grid;place-items:center;transform:rotate(-6deg);box-shadow:inset 0 -6px 0 #0002,var(--shadow);animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:rotate(4deg) translateY(-6px)}}
.load-box h1{margin:0;font-size:clamp(34px,8vw,56px);font-weight:900;letter-spacing:4px;line-height:1.05}
.load-box p{margin:0;color:var(--muted)}
.load-err{background:#fff;border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);text-align:left;font-size:13px;line-height:1.6;border-left:4px solid var(--coral)}
.load-err code{font:12px var(--mono);word-break:break-all;color:#a33c1e}
.modal{background:var(--paper-solid);border-radius:22px;box-shadow:var(--shadow);padding:22px;max-width:440px;width:100%;display:grid;gap:14px;max-height:100%;overflow:auto}
.modal h2{margin:0;font-size:22px}
.steps{margin:0;padding:0;list-style:none;display:grid;gap:10px;counter-reset:s}
.steps li{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;font-size:14px;line-height:1.55}
.steps li::before{counter-increment:s;content:counter(s);width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--cream);display:grid;place-items:center;font:700 14px var(--mono)}
.steps b{display:block}
.row-end{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.toss-stage{height:130px;display:flex;align-items:center;justify-content:center;gap:28px;perspective:400px}
.cup{width:74px;height:46px;transform-style:preserve-3d}
.cup svg{width:100%;height:100%;display:block}
.tossing .cup{animation:toss .9s cubic-bezier(.3,.6,.4,1) both}
.tossing .cup:nth-child(2){animation-delay:.08s}
@keyframes toss{0%{transform:translateY(0) rotateX(0)}45%{transform:translateY(-70px) rotateX(540deg) rotateZ(20deg)}80%{transform:translateY(4px) rotateX(1060deg)}100%{transform:translateY(0) rotateX(1080deg)}}
.verdict{text-align:center;display:grid;gap:6px}
.verdict b{font-size:24px}
.poem{font-size:17px;line-height:1.9;text-align:center;background:#fff;border-radius:14px;padding:12px;letter-spacing:2px;border:1px dashed #e5c7b3}
.stamp-new{justify-self:center;width:64px;height:64px;border-radius:10px;border:3px solid var(--coral);color:var(--coral);display:grid;place-items:center;font-size:30px;font-weight:900;transform:rotate(-8deg)}
.gift3d{font-size:0;width:90px;height:90px;position:relative}
.gift3d i{position:absolute;inset:20px 8px 0;background:var(--coral);border-radius:8px}
.gift3d i::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:12px;margin-left:-6px;background:var(--yellow)}
.gift3d b{position:absolute;left:2px;right:2px;top:8px;height:22px;background:#e2552a;border-radius:6px;transition:transform .6s}
.gift3d b::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:12px;margin-left:-6px;background:var(--yellow)}
.opened .gift3d b{transform:translateY(-34px) rotate(-18deg)}

/* ---------- sheets (mobile) ---------- */
.handle{display:none}

@media (max-width:800px){
  :root{--hudH:0px}
  #leftCol{right:calc(16px + var(--sr));width:auto;bottom:auto;gap:8px}
  .brand{padding:10px 12px;gap:6px;max-width:360px}
  .brand-mark{width:36px;height:36px;font-size:18px;border-radius:10px}
  .brand h1{font-size:19px}
  .brand p{display:none}
  .tools{flex-direction:column;padding:4px}
  .tools .btn{min-width:48px;padding:4px 6px}
  .card,#side{position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;border-radius:22px 22px 0 0;z-index:9;padding-bottom:var(--sb)}
  .card{height:34%;max-height:none}
  #side{height:52%;z-index:8}
  #side{top:auto}
  .handle{display:block;height:24px;flex:none;cursor:ns-resize;touch-action:none;position:relative}
  .handle::after{content:"";position:absolute;left:50%;top:9px;width:44px;height:5px;margin-left:-22px;border-radius:5px;background:#cdbbad}
  .card-scroll{padding-top:4px}
  .card-close{top:6px}
  #hud{display:none;flex-wrap:wrap;justify-content:center;border-radius:20px;bottom:calc(78px + var(--sb));left:16px;right:16px;transform:none;max-width:none}
  #hud.pop{display:flex}
  #timeBtn{display:inline-flex;position:absolute;z-index:7;right:calc(16px + var(--sr));bottom:calc(16px + var(--sb));background:var(--ink);color:var(--cream);border-radius:999px;padding:0 18px;box-shadow:var(--shadow);font-weight:800}
  #log{top:auto;bottom:calc(150px + var(--sb));left:16px;right:16px;width:auto;max-height:32%}
  #app.side-open #log{right:16px}
  #legend{bottom:calc(76px + var(--sb))}

function computeCity() {
  CITY = new THREE.Vector3();
  DATA.islands.forEach((d) => CITY.add(axial(d.q, d.r)));
  CITY.multiplyScalar(1 / DATA.islands.length);
  CITY.y = 0.3;
}
function axial(q, r) { return new THREE.Vector3(SQ3 * SPACING * (q + r / 2), 0, 1.5 * SPACING * r); }

function setupRenderer() {
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, MOBILE_AT_START ? 1.4 : 1.75));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1;
  $('#stage').appendChild(renderer.domElement);
  renderer.domElement.setAttribute('tabindex', '0');

  labelRenderer = new CSS2DRenderer({ element: $('#labels') });

  scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0xf4eee3, 42, 150);

  camera = new THREE.PerspectiveCamera(32, 1, 0.3, 320);
  camera.position.set(CITY.x + 7, 10, CITY.z + 26);

  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.07;
  controls.enablePan = false;
  controls.minPolarAngle = THREE.MathUtils.degToRad(25);
  controls.maxPolarAngle = THREE.MathUtils.degToRad(70);
  controls.minDistance = 3;
  controls.maxDistance = 70;
  controls.target.copy(CITY);
  controls.addEventListener('change', markDirty);
}

function resize() {
  const el = $('#app');
  const w = el.clientWidth || window.innerWidth, h = el.clientHeight || window.innerHeight;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, isMobile() ? 1.4 : 1.75));
  renderer.setSize(w, h, false);
  labelRenderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  markDirty();
}

function flatten(g) { const n = g.index ? g.toNonIndexed() : g; n.computeVertexNormals(); return n; }
function makeGeos() {

  GEO.dome = new THREE.SphereGeometry(0.5, 16, 8, 0, Math.PI * 2, 0, Math.PI / 2);
  GEO.torus = new THREE.TorusGeometry(0.5, 0.12, 8, 24);
  GEO.arch = new THREE.TorusGeometry(0.5, 0.08, 8, 16, Math.PI);
  GEO.hip = flatten(new THREE.ConeGeometry(Math.SQRT1_2, 1, 4, 1).rotateY(Math.PI / 4));
  const tri = new THREE.Shape([new THREE.Vector2(-0.5, -0.5), new THREE.Vector2(0.5, -0.5), new THREE.Vector2(0, 0.5)]);
  GEO.prism = flatten(new THREE.ExtrudeGeometry(tri, { depth: 1, bevelEnabled: false }).translate(0, 0, -0.5).rotateY(Math.PI / 2));
  GEO.disc = new THREE.CircleGeometry(0.5, 20).rotateX(-Math.PI / 2);
}

  });
}

function radialTexture() {
  const cv = document.createElement('canvas'); cv.width = cv.height = 128;
  const g = cv.getContext('2d');
  const grd = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  grd.addColorStop(0, 'rgba(255,255,255,1)'); grd.addColorStop(0.35, 'rgba(255,255,255,.55)'); grd.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grd; g.fillRect(0, 0, 128, 128);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; return t;
}

function gridCands(g) {

    const z = row * rowH + 0.18, off = row & 1 ? g / 2 : 0;
    for (let col = -7; col <= 7; col++) {

      if (Math.hypot(x, z) + g * 0.45 > 1.36) continue;
      if (Math.abs(x) < 0.575 + g * 0.45 && z < -0.005 + g * 0.45) continue;
      out.push({ x, z });
    }
  }
  return out;
}

}

function marqueeColumns() {

const FLOWS = [];
const FLOW_BY_ID = new Map();
function makePath(pts) {
  const cum = [0];
  for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + pts[i].distanceTo(pts[i - 1]));
  return { pts, cum, len: cum[cum.length - 1] };
}
function pathAt(path, s, outPos, outTan) {
  s = clamp(s, 0, path.len);
  let i = 0;
  while (i < path.cum.length - 2 && path.cum[i + 1] < s) i++;
  const seg = path.cum[i + 1] - path.cum[i] || 1;
  const t = (s - path.cum[i]) / seg;
  outPos.lerpVectors(path.pts[i], path.pts[i + 1], t);
  outTan.subVectors(path.pts[i + 1], path.pts[i]).normalize();
}
function flowMaterial(level, len) {
  return new THREE.ShaderMaterial({
    uniforms: {
      uTime: { value: 0 }, uLen: { value: len }, uStyle: { value: level === 'official' ? 0 : level === 'thematic' ? 1 : 2 },
      uColor: { value: new THREE.Color(C.coral) }, uOpacity: { value: 0.82 }, uStatic: { value: reduced ? 1 : 0 }
    },
    vertexShader: /* glsl */`varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
    fragmentShader: /* glsl */`
      uniform float uTime; uniform float uLen; uniform float uStyle; uniform float uOpacity; uniform float uStatic; uniform vec3 uColor; varying vec2 vUv;
      void main(){
        float u = vUv.x*uLen*5. - uTime*1.4*(1.-uStatic);
        float f = fract(u);
        float style = uStatic > .5 ? max(uStyle, 1.) : uStyle;
        if (style > .5 && style < 1.5 && f > .6) discard;
        if (style > 1.5 && f > .3) discard;
        float pulse = style < .5 ? .8 + .2*smoothstep(.5, 1., fract(u*.2)) : 1.;
        gl_FragColor = vec4(uColor*pulse, uOpacity);
        #include <colorspace_fragment>
      }`,
    transparent: true, depthWrite: false, toneMapped: false
  });
}
function buildFlows() {
  DATA.flows.forEach((f, idx) => {
    const pts = routeBetween(f.from, f.to);
    const lift = 0.07 + idx * 0.012;
    const curve = new THREE.CatmullRomCurve3(pts.map((p) => p.clone().setY(p.y + lift)), false, 'catmullrom', 0.2);
    const len = curve.getLength();
    const mat = flowMaterial(f.level, len);
    const mesh = new THREE.Mesh(new THREE.TubeGeometry(curve, Math.max(32, pts.length * 8), 0.035, 6, false), mat);
    mesh.visible = false; mesh.renderOrder = 3;
    const rec = { d: f, idx, path: makePath(pts), len, mesh, mat, walkers: [] };
    mesh.userData.flow = rec;
    scene.add(mesh);
    FLOWS.push(rec); FLOW_BY_ID.set(f.id, rec);
  });
}

const _proj = { v: null };
const RANK = { full: 0, compact: 1, hide: 2 };
function layoutLabels() {
  if (!_proj.v) _proj.v = new THREE.Vector3();

  const ui = [];
  for (const sel of ['.brand', '.tools', '#card', '#side', '#hud', '#log', '#legend', '#timeBtn']) {
    const el = $(sel); if (!el || el.hidden) continue;
    const r = el.getBoundingClientRect(); if (r.width && r.height) ui.push([r.left, r.top, r.right, r.bottom]);
  }

  entries.sort((a, b) => a.pri - b.pri || a.z - b.z);

  const hit = (r) => ui.some((u) => r[0] < u[2] && r[2] > u[0] && r[1] < u[3] && r[3] > u[1]) || placed.some((u) => r[0] < u[2] && r[2] > u[0] && r[1] < u[3] && r[3] > u[1]);

    for (const s of states) {

      const r = [e.x - w / 2 - m, e.y - h - 6 - m, e.x + w / 2 + m, e.y + m];

function islandAt(x, z) {
  const r = z / (1.5 * SPACING), q = x / (SQ3 * SPACING) - r / 2;

  const dx = Math.abs(rx - q), dz = Math.abs(rz - r), dy = Math.abs(ry - (-q - r));
  if (dx > dy && dx > dz) rx = -ry - rz; else if (dz > dy) rz = -rx - ry;
  const isl = ISL.find((i) => i.d.q === rx && i.d.r === rz);

}
let raycaster = null;
function pickAt(cx, cy) {
  if (!raycaster) raycaster = new THREE.Raycaster();

  raycaster.setFromCamera({ x: ((cx - r.left) / r.width) * 2 - 1, y: -((cy - r.top) / r.height) * 2 + 1 }, camera);
  const targets = [];
  if (state.showCargo) { WK.body.boundingSphere = null; targets.push(WK.body); }
  FLOWS.forEach((f) => { if (f.mesh.visible) targets.push(f.mesh); });
  targets.push(...mainKit.meshes);
  const hits = raycaster.intersectObjects(targets, false);
  for (const h of hits) {
    if (h.object === WK.body) { const w = WALKERS[h.instanceId]; if (w) return selectWalker(w); continue; }
    if (h.object.userData.flow) return selectFlow(h.object.userData.flow);
    const owners = h.object.userData.owners;
    if (owners) {
      const o = owners[h.instanceId];
      if (!o) continue;
      if (ITEM.has(o)) return selectItem(ITEM.get(o));
      if (ISL_BY_ID.has(o)) return selectIsland(ISL_BY_ID.get(o));
    }
  }
  const ray = raycaster.ray;
  if (ray.direction.y < -1e-4) {
    const t = (TOP - ray.origin.y) / ray.direction.y;
    const p = ray.origin.clone().addScaledVector(ray.direction, t);
    const isl = islandAt(p.x, p.z);
    if (isl) return selectIsland(isl);
  }
  clearSelection();
}

let thumbR = null, thumbScene = null, thumbCam = null;
const THUMBS = new Map(), THUMB_MATS = new Map();
function thumbFor(rec) {
  const id = rec.d.id;
  if (THUMBS.has(id)) return THUMBS.get(id);
  let url = null;
  try {
    if (!thumbR) {
      thumbR = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
      thumbR.setPixelRatio(2); thumbR.setSize(160, 160, false);
      thumbR.outputColorSpace = THREE.SRGBColorSpace; thumbR.toneMapping = THREE.ACESFilmicToneMapping;
      thumbScene = new THREE.Scene();
      thumbScene.add(new THREE.HemisphereLight(0xffffff, 0x8f8270, 1.7));
      const dl = new THREE.DirectionalLight(0xfff1de, 2.4); dl.position.set(2, 4, 3); thumbScene.add(dl);
      thumbCam = new THREE.PerspectiveCamera(30, 1, 0.01, 50);
    }
    const grp = new THREE.Group(), inv = rec.base.clone().invert();
    for (let i = rec.parts[0]; i < rec.parts[1]; i++) {
      const p = mainKit.parts[i];
      const key = p.kind.slice(0, 2) + (p.tag && p.tag.mq ? '#ff4b3a' : p.c);
      if (!THUMB_MATS.has(key)) {
        const col = p.tag && p.tag.mq ? ((p.tag.c + p.tag.r) % 3 ? '#3a2524' : '#ff4b3a') : p.c;
        THUMB_MATS.set(key, p.kind.startsWith('l_') ? new THREE.MeshBasicMaterial({ color: col, toneMapped: false })
          : new THREE.MeshStandardMaterial({ color: col, roughness: 0.78, emissive: p.kind.startsWith('g_') ? 0xffc777 : 0x000000, emissiveIntensity: 0.35 }));
      }
      const m = new THREE.Mesh(GEO[p.kind.replace(/^[gl]_/, '')], THUMB_MATS.get(key));
      m.matrixAutoUpdate = false; m.matrix.multiplyMatrices(inv, p.m);
      grp.add(m);
    }
    thumbScene.add(grp); grp.updateMatrixWorld(true);
    const sph = new THREE.Box3().setFromObject(grp).getBoundingSphere(new THREE.Sphere());
    const dist = sph.radius / Math.sin(THREE.MathUtils.degToRad(15)) * 1.02;
    thumbCam.position.copy(sph.center).add(new THREE.Vector3(0.55, 0.45, 0.85).normalize().multiplyScalar(dist));
    thumbCam.lookAt(sph.center);
    thumbR.render(thumbScene, thumbCam);
    url = thumbR.domElement.toDataURL('image/png');
    thumbScene.remove(grp);
  } catch (e) { console.warn('thumbnail failed', e); }
  THUMBS.set(id, url);
  return url;
}

  const gift = isl.d.ritual === 'gift';
  $('#tossEyebrow').textContent = gift ? tr('拆禮物 · ', 'Gift · ') + shortName(isl.d) : tr('擲筊 · ', 'Moon blocks · ') + shortName(isl.d);
  $('#tossTitle').textContent = gift ? tr('聖誕老人的禮物袋', "Santa's sack") : tr('向神明請示', 'Ask the deity');
  $('#toss').hidden = false;
  doToss();
  $('#tossClose').focus();
}
function closeToss() { $('#toss').hidden = true; tossBusy = false; if (state.sel) renderCard(); }
function doToss() {
  if (tossBusy || !tossIsl) return;
  tossBusy = true;
  const isl = tossIsl, d = isl.d, gift = d.ritual === 'gift';
  const stage = $('#tossStage'), verdict = $('#tossVerdict');
  verdict.innerHTML = '';
  const a = Math.random() < 0.5, b = Math.random() < 0.5;
  const result = gift ? 'gift' : a !== b ? 'sheng' : a ? 'xiao' : 'yin';
  stage.classList.remove('opened', 'tossing');
  stage.innerHTML = gift ? `<div class="gift3d"><i></i><b></b></div>` : `<div class="cup">${cupSVG(true)}</div><div class="cup">${cupSVG(false)}</div>`;
  void stage.offsetWidth;
  stage.classList.add(gift ? 'opened' : 'tossing');
  const finish = () => {
    if (!gift) stage.innerHTML = `<div class="cup">${cupSVG(a)}</div><div class="cup">${cupSVG(b)}</div>`;
    const g = state.game;
    g.tosses = (g.tosses || 0) + 1;
    let html = '';
    if (result === 'sheng' || result === 'gift') {
      const had = !!g.stamps[d.id];
      g.stamps[d.id] = true; g.incense = (g.incense || 0) + 10;
      const poem = T(d.poems[Math.floor(Math.random() * d.poems.length)]);
      html = `<b>${gift ? tr('拆開了！', 'Unwrapped!') : tr('聖筊！神明同意了', 'Yes! The deity agrees')}</b>
        ${had ? `<span class="muted">${tr('這枚印章已經有了，香火 +10。', 'You already have this stamp. Incense +10.')}</span>` : `<div class="stamp-new">${esc(d.seal)}</div><span class="muted">${tr('獲得印章：', 'New stamp: ')}${esc(T(d.deity))}</span>`}
        <div class="poem">${esc(poem)}</div>`;
      const n = Object.keys(g.stamps).filter((k) => ISL_BY_ID.has(k)).length;
      if (n === ISL.length && !had) html += `<b style="color:var(--coral)">${tr('全島圓滿！12 枚印章到齊', 'All 12 stamps collected!')}</b>`;
    } else if (result === 'xiao') {
      html = `<b>${tr('笑筊', 'Laughing blocks')}</b><span class="muted">${tr('兩面朝上，神明笑而不答。再擲一次看看。', 'Both flat sides up: the deity just smiles. Try again.')}</span>`;
    } else {
      html = `<b>${tr('陰筊', 'No for now')}</b><span class="muted">${tr('兩面朝下，神明說再想想。換個心情再試。', 'Both round sides up: not yet. Take a breath and try again.')}</span>`;
    }
    store.set(GAME_KEY, g);
    verdict.innerHTML = html;
    renderSeals();
    tossBusy = false;
  };
  if (reduced) finish(); else setTimeout(finish, gift ? 650 : 950);
}

// ---------- 說明 ----------
function openHelp() { $('#help').hidden = false; setTimeout(() => $('#helpOk').focus(), 30); }
function closeHelp() { $('#help').hidden = true; store.set(HELP_KEY, true); }

// ---------- 時間 ----------
let lastClock = '';
function updateClock() { const s = clockStr(state.minutes); if (s !== lastClock) { lastClock = s; $('#clockTime').textContent = s; } }
function segIndexFor(min) {
  let idx = DATA.dayCycle.length - 1;
  DATA.dayCycle.forEach((s, i) => { if (min >= s.start) idx = i; });
  return idx;
}
function updateSegment(force) {
  const idx = segIndexFor(state.minutes);
  if (idx === state.segIndex && !force) return;
  state.segIndex = idx;
  $('#clockSeg').textContent = T(DATA.dayCycle[idx].label);
  applyHighlights();
  const lit = currentLitSet();
  PINS.forEach((p) => p.el.classList.toggle('lit', lit.has(p.rec.d.id)));
  renderSide();
  if (state.sel && state.sel.kind === 'island') $$('#cardBody .item-row').forEach((el) => {
    const on = lit.has(el.dataset.item), badge = el.querySelector('.lit');
    if (on && !badge) el.insertAdjacentHTML('beforeend', `<span class="lit">${tr('此時段', 'NOW')}</span>`);
    if (!on && badge) badge.remove();
  });
  markDirty();
}
function setTime(min) {
  state.minutes = min; state.lastSunStep = -1;
  applyDayNight(min); updateClock(); updateSegment(); markDirty();
}

// ---------- 底部抽屜拖曳（手機） ----------
function setupSheets() {
  $$('.handle').forEach((hd) => {
    hd.addEventListener('pointerdown', (e) => {
      const sheet = hd.parentElement, startY = e.clientY, startH = sheet.getBoundingClientRect().height, H = $('#app').clientHeight;
      hd.setPointerCapture(e.pointerId);
      const move = (ev) => { sheet.style.height = clamp(startH + (startY - ev.clientY), 60, H) + 'px'; };
      const up = () => {
        hd.removeEventListener('pointermove', move); hd.removeEventListener('pointerup', up); hd.removeEventListener('pointercancel', up);
        const h = sheet.getBoundingClientRect().height;
        if (h < H * 0.18) { if (sheet.id === 'card') clearSelection(); else setSide(false); sheet.style.height = ''; return; }
        const snaps = [0.34, 0.52, 1].map((r) => r * H);
        sheet.style.height = snaps.reduce((a, b) => (Math.abs(b - h) < Math.abs(a - h) ? b : a)) + 'px';
        markDirty();
      };
      hd.addEventListener('pointermove', move); hd.addEventListener('pointerup', up); hd.addEventListener('pointercancel', up);
    });
  });
}

function setupUI() {
  $('#brandName').textContent = T(DATA.meta.company);
  $('#brandSub').textContent = T(DATA.meta.sub);
  $('#brandTag').textContent = T(DATA.meta.tagline);
  $('#btnLang').textContent = LANG === 'en' ? '中文' : 'English';
  renderSeals();
  $('#logFilter').innerHTML = `<option value="">${tr('全部協作線', 'All links')}</option>` + FLOWS.map((f) => `<option value="${f.d.id}">${esc(T(f.d.name))}</option>`).join('');
  setSide(window.innerWidth >= 1180);

  const delegate = (root) => root.addEventListener('click', (e) => {
    const t = e.target.closest('[data-isl],[data-item],[data-flow],[data-act]');
    if (!t || !root.contains(t)) return;
    const fromList = root.id === 'sideBody';
    if (t.dataset.act === 'toss') { const isl = selectedIsland(); if (isl) openToss(isl); return; }
    if (t.dataset.item) return selectItem(ITEM.get(t.dataset.item), { fromList });
    if (t.dataset.flow) return selectFlow(FLOW_BY_ID.get(t.dataset.flow), { fromList });
    if (t.dataset.isl) {
      if (t.tagName === 'SUMMARY') { const isl = ISL_BY_ID.get(t.dataset.isl); if (selectedIsland() !== isl) setTimeout(() => select('island', isl, { fromList: false }), 0); return; }
      return selectIsland(ISL_BY_ID.get(t.dataset.isl), { fromList });
    }
  });
  delegate($('#sideBody')); delegate($('#cardBody')); delegate($('#seals'));

  $('#search').addEventListener('input', renderSide);
  const setTab = (tab) => {
    sideTab = tab;
    $('#tabIsles').classList.toggle('on', tab === 'isles'); $('#tabIsles').setAttribute('aria-selected', String(tab === 'isles'));
    $('#tabFlows').classList.toggle('on', tab === 'flows'); $('#tabFlows').setAttribute('aria-selected', String(tab === 'flows'));
    renderSide();
  };
  $('#tabIsles').addEventListener('click', () => setTab('isles'));
  $('#tabFlows').addEventListener('click', () => setTab('flows'));

  $('#btnOverview').addEventListener('click', () => { clearSelection(); overview(false); });
  $('#btnList').addEventListener('click', () => setSide(!state.sideOpen));
  $('#btnHelp').addEventListener('click', openHelp);
  $('#helpOk').addEventListener('click', closeHelp);
  $('#btnLang').addEventListener('click', () => {
    try { localStorage.setItem('usled-isles-lang', LANG === 'en' ? 'zh' : 'en'); } catch (e) { /* ignore */ }
    store.set(HELP_KEY, true);
    location.hash = LANG === 'en' ? 'zh' : 'en';
    location.reload();
  });
  $('#cardClose').addEventListener('click', clearSelection);
  $('#tossAgain').addEventListener('click', doToss);
  $('#tossClose').addEventListener('click', closeToss);
  $('#toss').addEventListener('click', (e) => { if (e.target.id === 'toss') closeToss(); });
  $('#help').addEventListener('click', (e) => { if (e.target.id === 'help') closeHelp(); });

  $$('#hud [data-time]').forEach((b) => b.addEventListener('click', () => setTime(Number(b.dataset.time))));
  const toggle = (id, key, after) => $(id).addEventListener('click', () => { state[key] = !state[key]; $(id).setAttribute('aria-pressed', String(state[key])); after && after(); markDirty(); });
  toggle('#tgNames', 'showNames');
  toggle('#tgCargo', 'showCargo');
  toggle('#tgFlows', 'showFlows', updateFlowVisibility);
  toggle('#tgPause', 'paused');
  $('#tgBird').addEventListener('click', () => setBird(!state.bird));
  toggle('#tgLog', 'showLog', () => { $('#log').hidden = !state.showLog; if (state.showLog) renderLog(); });
  $('#logFilter').addEventListener('change', renderLog);
  $('#timeBtn').addEventListener('click', () => { const on = !$('#hud').classList.contains('pop'); $('#hud').classList.toggle('pop', on); $('#timeBtn').setAttribute('aria-expanded', String(on)); markDirty(); });
  setupSheets();
  updateClock();
}

function setupInput() {
  const el = renderer.domElement;
  let down = null;
  el.addEventListener('pointerdown', (e) => { down = { x: e.clientX, y: e.clientY }; cancelFlight(); });
  el.addEventListener('pointerup', (e) => {
    if (!down) return;
    const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y);
    down = null;
    if (moved <= 6) pickAt(e.clientX, e.clientY);
  });
  controls.addEventListener('start', cancelFlight);
  window.addEventListener('keydown', (e) => {
    if (e.target.matches && e.target.matches('input, select, textarea')) return;
    if (e.key === 'Escape') {
      if (!$('#toss').hidden) closeToss(); else if (!$('#help').hidden) closeHelp(); else clearSelection();
      return;
    }
    const map = { ArrowLeft: [0.09, 0], ArrowRight: [-0.09, 0], ArrowUp: [0, -0.07], ArrowDown: [0, 0.07] };
    if (map[e.key] && $('#toss').hidden && $('#help').hidden) { e.preventDefault(); cancelFlight(); rotateCam(...map[e.key]); }
  });
  reducedMQ.addEventListener('change', (e) => {
    reduced = e.matches;
    FLOWS.forEach((f) => { f.mat.uniforms.uStatic.value = reduced ? 1 : 0; });
    if (reduced && flight) { camera.position.copy(flight.p1); controls.target.copy(flight.t1); flight = null; }
    markDirty();
  });
  document.addEventListener('visibilitychange', () => { last = performance.now(); });
}

// ============================================================================
// 19. 主迴圈：只在需要時 render
// ============================================================================
let last = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min((now - last) / 1000, 0.08);
  last = now;
  const running = !state.paused && !reduced;
  if (running) {
    state.time += dt;
    state.minutes = (state.minutes + dt * 10) % 1440;
    updateWalkers(dt); updateClouds(dt); updateBoats(state.time); updateSnow(dt); updateMarquee(false);
    waterMat.uniforms.uTime.value = state.time;
    for (const f of FLOWS) f.mat.uniforms.uTime.value = state.time;
    applyDayNight(state.minutes); updateClock(); updateSegment(false);
    dirty = true;
  }
  if (flight) { updateFlight(now); dirty = true; }
  if (controls.update()) dirty = true;
  if (!dirty) return;
  dirty = false;
  const camDist = camera.position.distanceTo(controls.target);
  smallGroup.visible = camDist < 26;
  drawWalkers(camDist);
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
  layoutLabels();
}

boot();
</script>
</body></html>
