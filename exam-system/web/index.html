<title>JR 考卷中心</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
:root{
  --bg:#12151c; --bg2:#1a1f2a; --card:#1e2430; --card2:#252c3a; --line:#323b4d;
  --ink:#eef2f8; --ink2:#9aa6bb; --gold:#ffc93c; --gold2:#ffe89a;
  --ok:#5ed68a; --bad:#ff7a6b; --acc:#4ea8ff; --warn:#ffb043;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;font-size:16px;line-height:1.7;padding-block:20px 72px;padding-inline:14px;
 background-image:radial-gradient(900px 420px at 50% -8%,#2a3446 0%,transparent 70%)}
.wrap{max-width:760px;margin:0 auto}
h1{font-size:23px;font-weight:900;margin:0;letter-spacing:1px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.top .who{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2)}
.top input{font:inherit;font-size:14px;width:110px;padding:5px 9px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.sub{color:var(--ink2);font-size:13px;margin-bottom:16px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ink2);margin-right:5px;vertical-align:1px}
.dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}

/* 週曆獎章板 */
.board{background:linear-gradient(180deg,#232b3a,#1a202b);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:18px;
 box-shadow:0 10px 30px rgba(0,0,0,.35)}
.board h2{margin:0 0 2px;font-size:19px;font-weight:900;text-align:center;color:var(--gold);letter-spacing:3px;
 text-shadow:0 2px 10px rgba(255,201,60,.35)}
.board .tag{text-align:center;color:var(--ink2);font-size:12px;letter-spacing:4px;margin-bottom:14px}
.grid{display:grid;gap:9px;grid-template-columns:repeat(4,1fr);
 grid-template-areas:"d1 d2 d3 d7" "d4 d5 d6 d7"}
@media(max-width:560px){.grid{grid-template-columns:repeat(2,1fr);grid-template-areas:"d1 d2" "d3 d4" "d5 d6" "d7 d7"}}
.day{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 6px 10px;text-align:center;position:relative;min-height:112px;
 display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:4px}
.day.today{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 0 18px rgba(255,201,60,.22)}
.day.empty{opacity:.42}
.day .dn{font-size:12px;color:var(--ink2);font-weight:700;letter-spacing:1px}
.day.today .dn{color:var(--gold)}
.day .mn{font-size:12px;font-weight:700;margin-top:1px}
.day .sc{font-size:11px;color:var(--ink2);font-variant-numeric:tabular-nums}
.day .slot{width:44px;height:44px;display:grid;place-items:center}
.day .none{width:34px;height:34px;border:2px dashed var(--line);border-radius:50%}
#d7{grid-area:d7;background:linear-gradient(180deg,#2c3446,#202736);border-color:#46536d}
#d7 .slot{width:66px;height:66px}
#d1{grid-area:d1}#d2{grid-area:d2}#d3{grid-area:d3}#d4{grid-area:d4}#d5{grid-area:d5}#d6{grid-area:d6}
.legend{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px;font-size:11px;color:var(--ink2)}
.legend span{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:2px 9px}

/* 任務卡 */
.cards{display:grid;gap:10px;grid-template-columns:1fr 1fr;margin-bottom:18px}
@media(max-width:480px){.cards{grid-template-columns:1fr}}
.task{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.task:hover{background:var(--card2)}
.task:disabled{opacity:.45;cursor:default}
.task .big{font-size:27px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;color:var(--gold)}
.task .lb{font-size:13px;color:var(--ink2)}
.task .nm{font-weight:700;font-size:15px}
.task.review .big{color:var(--acc)}

h3.sec{font-size:15px;font-weight:700;margin:22px 0 8px;color:var(--ink2);letter-spacing:1px;display:flex;align-items:center;gap:8px}
h3.sec::before{content:"";width:4px;height:15px;background:var(--gold);border-radius:2px}
.papers{display:grid;gap:8px}
.paper{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 14px;display:flex;align-items:center;gap:11px;cursor:pointer;font:inherit;color:inherit;text-align:left;width:100%}
.paper:hover{background:var(--card2)}
.paper .pi{flex:none;width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--card2);border:1px solid var(--line)}
.paper .pt{flex:1;min-width:0}
.paper .pn{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.paper .pm{font-size:12px;color:var(--ink2)}
.paper .pb{flex:none;text-align:right;font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.paper .pb b{display:block;font-size:16px;color:var(--gold)}
.paper .pb.none b{color:var(--ink2)}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:6px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--ink2);font-weight:500;font-size:12px}
.tw{overflow-x:auto}
.muted{color:var(--ink2);font-size:14px}
</style>
<style>
/* 作答畫面 */
#exam{position:fixed;inset:0;background:var(--bg);z-index:20;overflow-y:auto;padding-block:16px 80px;padding-inline:14px;display:none}
#exam.on{display:block}
.ebar{position:sticky;top:0;background:var(--bg);padding:8px 0 10px;border-bottom:1px solid var(--line);margin-bottom:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--ink2);z-index:2}
.ebar b{color:var(--ink)}
.ebar .x{margin-left:auto;background:none;border:1px solid var(--line);color:var(--ink2);border-radius:8px;padding:4px 11px;font:inherit;font-size:13px;cursor:pointer}
.etitle{font-size:18px;font-weight:900;margin-bottom:2px}
.rule{background:#2a2216;border-left:3px solid var(--warn);color:#e8d9b8;padding:8px 12px;font-size:12.5px;border-radius:0 8px 8px 0;margin-bottom:14px}
.notice{background:#3a2420;border:1px solid var(--bad);color:#ffd9d2;padding:10px 13px;border-radius:9px;font-size:13.5px;margin-bottom:14px}
.q{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:14px 16px;margin-bottom:11px}
.q .stem{display:flex;gap:9px;margin-bottom:9px;font-weight:500;white-space:pre-line}
.q .no{flex:none;color:var(--gold);font-weight:900;min-width:24px;font-variant-numeric:tabular-nums}
.blank{display:inline-block;min-width:58px;border-bottom:2px solid var(--ink2);text-align:center;line-height:1}
.q.done .blank{color:var(--ok);border-bottom-color:var(--ok);font-weight:700}
.opts{display:grid;gap:5px;margin:0;padding:0;list-style:none}
.opts label{display:flex;gap:9px;align-items:flex-start;padding:8px 10px;border:1px solid transparent;border-radius:8px;cursor:pointer}
.opts label:hover{background:var(--card2)}
.opts input{margin-top:6px;accent-color:var(--gold)}
.opts label:has(input:checked){background:var(--card2);border-color:var(--line)}
.q.right .opts label:has(input:checked){background:#1d3527;border-color:var(--ok)}
.q.wrong .opts label:has(input:checked){background:#3a2420;border-color:var(--bad)}
.q.done .opts label.ans{background:#1d3527;border-color:var(--ok)}
.q.done .opts label{cursor:default}
.exp{display:none;margin-top:9px;padding:9px 12px;border-left:3px solid var(--acc);background:#1b2532;font-size:13.5px;border-radius:0 8px 8px 0}
.q.done .exp{display:block}
.exp .tg{font-weight:700;margin-right:6px}
.q.right .exp .tg{color:var(--ok)}.q.wrong .exp .tg{color:var(--bad)}
.again{color:var(--warn);font-weight:700;margin-left:6px;font-size:12.5px}
.btns{display:flex;flex-wrap:wrap;gap:9px;margin-top:20px}
button.go{font:inherit;font-weight:700;padding:11px 22px;border-radius:10px;border:none;background:linear-gradient(180deg,#ffd75e,#e9a81b);color:#2a1d00;cursor:pointer}
button.gh{background:transparent;border:1px solid var(--line);color:var(--ink)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}
.result{display:none;border:1px solid var(--gold);border-radius:13px;padding:18px;margin-top:18px;background:linear-gradient(180deg,#2a3143,#1d2431);text-align:center}
.result.on{display:block}
.result .mw{display:grid;place-items:center;margin-bottom:6px}
.score{font-size:46px;font-weight:900;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums}
.score small{font-size:15px;color:var(--ink2);font-weight:400;margin-left:5px}
.mname{font-size:17px;font-weight:900;margin-top:4px}
.result p{margin:8px 0 0;color:var(--ink2);font-size:13.5px}
</style>

<div class="wrap">
  <div class="top">
    <h1>JR 考卷中心</h1>
    <div class="who"><label for="who">作答者</label><input id="who" placeholder="名字"></div>
  </div>
  <div class="sub"><span class="dot" id="dot"></span><span id="status">連線中…</span></div>

  <div class="board">
    <h2>每日考試獎勵</h2>
    <div class="tag">天天作答 · 天天領獎</div>
    <div class="grid" id="grid"></div>
    <div class="legend">
      <span>95↑ 超級獎盃</span><span>90↑ 鑽石</span><span>85↑ 金牌</span><span>80↑ 銀牌</span><span>70↑ 銅牌</span><span>60↑ 獎狀</span><span>60↓ 豬頭</span>
    </div>
  </div>

  <div class="cards">
    <button class="task" id="tNew" disabled><span class="big" id="nNew">0</span><span><span class="nm">今天要考</span><br><span class="lb" id="lNew">尚未指派</span></span></button>
    <button class="task review" id="tRev" disabled><span class="big" id="nRev">0</span><span><span class="nm">今天要複習</span><br><span class="lb" id="lRev">沒有到期的錯題</span></span></button>
  </div>

  <h3 class="sec">所有考卷</h3>
  <div class="papers" id="papers"><p class="muted">載入中…</p></div>

  <h3 class="sec">作答紀錄</h3>
  <div class="tw" id="hist"><p class="muted">載入中…</p></div>
</div>

<div id="exam">
  <div class="wrap">
    <div class="ebar"><span id="eprog">已作答 <b>0</b> / 0</span><span id="ehint">全部作答後按交卷</span><button class="x" id="eclose">離開</button></div>
    <div class="etitle" id="etitle"></div>
    <div class="rule">作答中不要離開這個頁面。切到別的分頁或 App 超過 10 秒，本次會重新出題。</div>
    <div class="notice" id="enotice" hidden></div>
    <div id="epaper"></div>
    <div class="btns"><button class="go" id="esubmit">交卷</button></div>
    <div class="result" id="eresult">
      <div class="mw" id="emedal"></div>
      <div class="score"><span id="epts">0</span><small>分</small></div>
      <div class="mname" id="ename"></div>
      <p id="ecomment"></p>
      <div class="btns" style="justify-content:center"><button class="go" id="edone">回首頁</button><button class="go gh" id="eretry" hidden>再考一次（換題）</button></div>
    </div>
  </div>
</div>
<script>window.EXAM_API="";</script>
<script>
// 獎章分級與 SVG
const TIERS=[
 {min:95,key:'trophy',name:'超級獎盃',color:'#ffd24a'},
 {min:90,key:'diamond',name:'鑽石',color:'#6fe3ff'},
 {min:85,key:'gold',name:'金牌',color:'#ffc93c'},
 {min:80,key:'silver',name:'銀牌',color:'#d7dde4'},
 {min:70,key:'bronze',name:'銅牌',color:'#d78f4e'},
 {min:60,key:'cert',name:'獎狀',color:'#e8dcc0'},
 {min:0 ,key:'pig',name:'豬頭',color:'#f4a0b5'}
];
const tierOf=s=>TIERS.find(t=>s>=t.min);

function medalSVG(key,size){
  const s=size||64;
  const head=`<svg viewBox="0 0 64 64" width="${s}" height="${s}" aria-hidden="true">`;
  const G=(id,a,b)=>`<linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient>`;
  if(key==='trophy')return head+`<defs>${G('tg','#fff0b0','#e0a020')}<radialGradient id="tr"><stop offset="0" stop-color="#ffe9a0" stop-opacity=".95"/><stop offset="1" stop-color="#ffb020" stop-opacity="0"/></radialGradient></defs>
<circle cx="32" cy="32" r="30" fill="url(#tr)"/>
<g stroke="#ffd24a" stroke-width="2" stroke-linecap="round" opacity=".9">
<path d="M32 2v7M32 55v7M2 32h7M55 32h7M11 11l5 5M48 48l5 5M53 11l-5 5M16 48l-5 5"/></g>
<path d="M20 14h24v9a12 12 0 0 1-24 0z" fill="url(#tg)" stroke="#8a5a00" stroke-width="1.5"/>
<path d="M20 16h-5a6 6 0 0 0 6 8M44 16h5a6 6 0 0 1-6 8" fill="none" stroke="#8a5a00" stroke-width="2.4" stroke-linecap="round"/>
<rect x="29" y="34" width="6" height="8" fill="#c98a12"/>
<path d="M22 50h20l-2-6H24z" fill="url(#tg)" stroke="#8a5a00" stroke-width="1.5"/>
<path d="M27 19l2.2 4.4 4.8.7-3.5 3.4.8 4.8-4.3-2.3-4.3 2.3.8-4.8-3.5-3.4 4.8-.7z" fill="#fff8d8" opacity=".95"/></svg>`;
  if(key==='diamond')return head+`<defs>${G('dg','#d8fbff','#2aa8d8')}</defs>
<g stroke="#8fe9ff" stroke-width="1.6" opacity=".55"><path d="M32 4v6M32 54v6M6 32h6M52 32h6"/></g>
<path d="M18 18h28l10 12-24 26L8 30z" fill="url(#dg)" stroke="#1b7fa8" stroke-width="1.6" stroke-linejoin="round"/>
<path d="M18 18l6 12h16l6-12M8 30h48M24 30l8 26M40 30l-8 26" fill="none" stroke="#e8fdff" stroke-width="1.3" opacity=".85"/>
<path d="M22 21l3 6h-8z" fill="#ffffff" opacity=".5"/></svg>`;
  if(key==='gold'||key==='silver'||key==='bronze'){
    const c={gold:['#fff0a8','#dda012','#8a5a00'],silver:['#ffffff','#a8b2bd','#5d6771'],bronze:['#f6c99a','#b9702f','#6d3d14']}[key];
    const rib={gold:'#d94a3d',silver:'#3d6fd9',bronze:'#3d9d5a'}[key];
    return head+`<defs>${G('mg',c[0],c[1])}</defs>
<path d="M22 6l6 20h-12z" fill="${rib}"/><path d="M42 6l-6 20h12z" fill="${rib}" opacity=".8"/>
<circle cx="32" cy="40" r="19" fill="url(#mg)" stroke="${c[2]}" stroke-width="2"/>
<circle cx="32" cy="40" r="14" fill="none" stroke="${c[2]}" stroke-width="1.2" opacity=".6"/>
<path d="M32 29l3.4 6.9 7.6 1.1-5.5 5.4 1.3 7.6L32 46.4l-6.8 3.6 1.3-7.6-5.5-5.4 7.6-1.1z" fill="#fffdf0" opacity=".92"/></svg>`;
  }
  if(key==='cert')return head+`<defs>${G('cg','#fffdf2','#e2d3ae')}</defs>
<rect x="10" y="12" width="44" height="36" rx="3" fill="url(#cg)" stroke="#a8946a" stroke-width="1.8"/>
<g stroke="#a8946a" stroke-width="2" stroke-linecap="round" opacity=".7"><path d="M18 22h28M18 28h28M18 34h18"/></g>
<circle cx="45" cy="42" r="8" fill="#d94a3d" stroke="#8f2b22" stroke-width="1.4"/>
<path d="M42 50l-2 9 5-3 5 3-2-9" fill="#d94a3d" stroke="#8f2b22" stroke-width="1.2"/>
<path d="M45 38l1.6 3.3 3.6.5-2.6 2.5.6 3.6-3.2-1.7-3.2 1.7.6-3.6-2.6-2.5 3.6-.5z" fill="#ffe8e4"/></svg>`;
  return head+`<defs>${G('pg','#ffc9d8','#e26f92')}</defs>
<ellipse cx="32" cy="36" rx="22" ry="19" fill="url(#pg)" stroke="#b4436a" stroke-width="1.8"/>
<path d="M14 22c-3-7 1-11 6-9l4 5zM50 22c3-7-1-11-6-9l-4 5z" fill="#ffc9d8" stroke="#b4436a" stroke-width="1.8" stroke-linejoin="round"/>
<ellipse cx="32" cy="40" rx="10" ry="8" fill="#f79ab5" stroke="#b4436a" stroke-width="1.6"/>
<ellipse cx="28.5" cy="40" rx="2.2" ry="3" fill="#8f2b4d"/><ellipse cx="35.5" cy="40" rx="2.2" ry="3" fill="#8f2b4d"/>
<path d="M22 28q3-3 6 0M36 28q3-3 6 0" fill="none" stroke="#8f2b4d" stroke-width="2.4" stroke-linecap="round"/></svg>`;
}

/* 考卷網頁（LIFF 版）— 只跟 JR 說話，不碰任何金鑰 */
const QS=new URLSearchParams(location.search);
const API=(window.EXAM_API||'').replace(/\/$/,'')||'';
const S=QS.get('s')||'',T=QS.get('t')||'';
const CFG={pass:85,revMax:20};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const DAY=864e5;
const ymd=d=>{const z=new Date(d);z.setHours(0,0,0,0);return z.getFullYear()+'-'+String(z.getMonth()+1).padStart(2,'0')+'-'+String(z.getDate()).padStart(2,'0');};
const fmt=t=>{try{return new Date(t).toLocaleString('zh-TW',{hour12:false,month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});}catch(e){return'';}};
const api=(p,o)=>fetch(API+'/exam/api/'+p+(p.includes('?')?'&':'?')+'s='+encodeURIComponent(S)+'&t='+encodeURIComponent(T),o).then(r=>{if(!r.ok)throw new Error(r.status);return r.json();});

let home={papers:[],attempts:[],dueCount:0,board:[]},exam=null,submitted=false,awayAt=null,resets=0;

/* ---------- 首頁 ---------- */
const DN=['星期一','星期二','星期三','星期四','星期五','星期六','星期日'];
function drawBoard(){
  const b=home.board&&home.board.length?home.board:DN.map(n=>({name:n,score:null}));
  $('grid').innerHTML=b.map((d,i)=>{
    const t=d.score==null?null:tierOf(d.score);
    return `<div class="day${d.today?' today':''}${d.score==null?' empty':''}" id="d${i+1}">
      <div class="dn">${d.name}</div>
      <div class="slot">${t?medalSVG(t.key,i===6?66:44):'<div class="none"></div>'}</div>
      ${t?`<div class="mn" style="color:${t.color}">${t.name}</div><div class="sc">${d.score} 分</div>`:'<div class="sc">未作答</div>'}
    </div>`;}).join('');
}
function paperStat(p){const as=home.attempts.filter(a=>a.paperId===p.id);
  return{n:as.length,best:as.length?Math.max(...as.map(a=>a.score)):null};}
function renderPapers(){
  if(!home.papers.length){$('papers').innerHTML='<p class="muted">還沒有考卷。把講義拍照傳給 JR，出好的考卷就會出現在這裡。</p>';return;}
  $('papers').innerHTML=home.papers.map(p=>{const st=paperStat(p),t=st.best==null?null:tierOf(st.best);
    return `<button class="paper" data-p="${esc(p.id)}"><span class="pi">${esc((p.subject||'?').slice(0,2))}</span>
      <span class="pt"><span class="pn">${esc(p.title||p.id)}</span><span class="pm">${esc(p.unit||'')} · ${p.count} 題庫 · 考過 ${st.n} 次</span></span>
      <span class="pb ${st.best==null?'none':''}"><b>${st.best==null?'—':st.best}</b>${t?esc(t.name):'未作答'}</span></button>`;}).join('');
}
function refreshTasks(){
  const td=ymd(Date.now());
  const todayNew=home.papers.filter(p=>p.assigned===td);
  const undone=home.papers.filter(p=>!home.attempts.some(a=>a.paperId===p.id&&a.score>=CFG.pass));
  const list=todayNew.length?todayNew:undone;
  $('nNew').textContent=list.length;
  $('lNew').textContent=list.length?(list[0].title||list[0].id):'全部都及格了';
  $('tNew').disabled=!list.length;$('tNew').onclick=()=>list.length&&openExam('paper',list[0].id);
  $('nRev').textContent=home.dueCount;
  $('lRev').textContent=home.dueCount?`一次最多 ${CFG.revMax} 題`:'沒有到期的錯題';
  $('tRev').disabled=!home.dueCount;$('tRev').onclick=()=>home.dueCount&&openExam('review');
}
function renderHist(){
  if(!home.attempts.length){$('hist').innerHTML='<p class="muted">還沒有作答紀錄。</p>';return;}
  $('hist').innerHTML='<table><tr><th>時間</th><th>考卷</th><th>分數</th><th>獎章</th></tr>'+
    home.attempts.slice(0,40).map(a=>{const t=tierOf(a.score);
      return `<tr><td>${fmt(a.at)}</td><td>${esc(a.title||a.paperId)}</td><td style="color:${t.color};font-weight:700">${a.score}</td><td>${esc(a.medal||t.name)}</td></tr>`;}).join('')+'</table>';
}
$('papers').addEventListener('click',e=>{const b=e.target.closest('.paper');if(b)openExam('paper',b.dataset.p);});

/* ---------- 作答 ---------- */
async function openExam(kind,id){
  $('ehint').textContent='載入中…';
  try{exam=await api('exam?kind='+kind+(id?'&id='+encodeURIComponent(id):''));}
  catch(e){alert('載入考卷失敗，請稍後再試');return;}
  submitted=false;resets=0;
  $('etitle').textContent=exam.title||'';
  $('exam').classList.add('on');document.body.style.overflow='hidden';
  renderExam();window.scrollTo({top:0});
}
function renderExam(){
  let html='',lastPart=null;
  exam.items.forEach((it,n)=>{
    if(exam.parts&&it.p!==lastPart){lastPart=it.p;html+=`<h3 class="sec">${esc(exam.parts[it.p]||'')}</h3>`;}
    const stem=esc(it.s).split('___').map((s,i,arr)=>s.replace(/\n/g,'<br>')+(i<arr.length-1?'<span class="blank">&nbsp;</span>':'')).join('');
    const opts=it.o.map((t,k)=>`<li><label><input type="radio" name="q${n}" value="${k}"><span>(${'ABCD'[k]}) ${esc(t)}</span></label></li>`).join('');
    html+=`<div class="q" data-i="${n}"><div class="stem"><span class="no">${n+1}.</span><span>${stem}</span></div>
      <ul class="opts">${opts}</ul><div class="exp"><span class="tg"></span><span class="et"></span>
      ${exam.kind==='review'?`<span class="again">${esc(it.subject||'')}</span>`:''}</div></div>`;
  });
  $('epaper').innerHTML=html;
  $('eresult').classList.remove('on');$('esubmit').hidden=false;$('enotice').hidden=true;
  $('ehint').textContent='全部作答後按交卷';count();
}
function count(){const qs=[...$('epaper').querySelectorAll('.q')];
  const d=qs.filter(x=>x.querySelector('input:checked')).length;
  $('eprog').innerHTML=`已作答 <b>${d}</b> / ${qs.length}`;return d;}
$('epaper').addEventListener('change',count);

$('esubmit').addEventListener('click',async()=>{
  const answers=exam.items.map((it,n)=>{
    const sel=$('epaper').querySelector(`.q[data-i="${n}"] input:checked`);
    return{paperId:it.paperId,qid:it.qid,pick:sel?Number(sel.value):null};});
  $('esubmit').disabled=true;$('ehint').textContent='批改中…';
  let r;try{r=await api('submit',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({answers,kind:exam.kind,paperId:exam.items[0]?exam.items[0].paperId:'',resets})});}
  catch(e){alert('交卷失敗，請檢查網路後再按一次');$('esubmit').disabled=false;return;}
  submitted=true;
  const byKey={};r.detail.forEach(d=>byKey[d.paperId+':'+d.qid]=d);
  $('epaper').querySelectorAll('.q').forEach(div=>{
    const it=exam.items[+div.dataset.i],d=byKey[it.paperId+':'+it.qid];
    div.classList.add('done');div.querySelectorAll('input').forEach(i=>i.disabled=true);
    const labs=[...div.querySelectorAll('.opts label')];
    if(d){labs[d.a]&&labs[d.a].classList.add('ans');
      const b=div.querySelector('.blank');if(b)b.textContent=it.o[d.a];
      div.classList.add(d.ok?'right':'wrong');
      div.querySelector('.tg').textContent=d.ok?'答對':'答錯，正解 ('+'ABCD'[d.a]+')';
      div.querySelector('.et').textContent=d.e||'';}
  });
  const t=tierOf(r.score);
  $('epts').textContent=r.score;$('emedal').innerHTML=medalSVG(t.key,92);
  $('ename').textContent=t.name;$('ename').style.color=t.color;
  $('ecomment').textContent=r.score>=r.pass?`答對 ${r.right} / ${r.total} 題，達到 ${r.pass} 分。`
    :`答對 ${r.right} / ${r.total} 題，未達 ${r.pass} 分。答錯的題目明天會再出現。`;
  $('eretry').hidden=exam.kind==='review'||r.score>=r.pass;
  $('eresult').classList.add('on');$('esubmit').hidden=false;$('esubmit').disabled=false;$('esubmit').hidden=true;
  $('ehint').textContent='已交卷，往上看訂正';
  $('eprog').innerHTML=`已作答 <b>${r.total}</b> / ${r.total}`;
  $('eresult').scrollIntoView({behavior:'smooth',block:'nearest'});
});
$('edone').addEventListener('click',close);
$('eclose').addEventListener('click',()=>{if(!submitted&&count()>0&&!confirm('還沒交卷，確定離開？'))return;close();});
$('eretry').addEventListener('click',()=>openExam('paper',exam.items[0].paperId));
async function close(){$('exam').classList.remove('on');document.body.style.overflow='';await load();window.scrollTo({top:0});}

/* ---------- 防作弊 ---------- */
const gone=()=>{if(awayAt==null)awayAt=Date.now();};
async function back(){
  if(awayAt==null)return;const s=Math.round((Date.now()-awayAt)/1000);awayAt=null;
  if(!$('exam').classList.contains('on')||submitted)return;
  if(s>=10){resets++;
    const el=$('enotice');el.textContent=`你離開了 ${s} 秒，超過 10 秒，本次已重新出題，請從第 1 題重新作答。`;el.hidden=false;
    const kind=exam.kind,pid=exam.items[0]?exam.items[0].paperId:'';
    try{exam=await api('exam?kind='+kind+(kind==='paper'?'&id='+encodeURIComponent(pid):''));}catch(e){}
    renderExam();el.hidden=false;window.scrollTo({top:0});}
}
document.addEventListener('visibilitychange',()=>document.hidden?gone():back());
window.addEventListener('blur',gone);window.addEventListener('focus',back);window.addEventListener('pagehide',gone);

/* ---------- 啟動 ---------- */
async function load(){
  try{home=await api('home');}
  catch(e){$('status').textContent='連線失敗，請從 LINE 的連結重新開啟';return;}
  $('dot').classList.add('on');
  $('status').textContent=`${home.student} · ${home.papers.length} 張考卷`;
  $('who').value=home.student;$('who').readOnly=true;
  CFG.pass=home.pass||85;CFG.revMax=home.reviewMax||20;
  drawBoard();renderPapers();renderHist();refreshTasks();
}
if(!S||!T){$('status').textContent='請從 LINE 傳給你的連結開啟這個頁面';}
else{drawBoard();load();}
</script>
