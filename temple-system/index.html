<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>宮廟雲</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#8E1B16">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#F5F4F1; --paper:#FFFFFF; --ink:#1F1A17; --ink2:#5A524C; --muted:#8B837C; --rule:#E5E0DA; --soft:#F0ECE7;
  --accent:#8E1B16; --accent-ink:#FFFFFF; --gold:#9A6B12;
  --s1:#B3261E; --s2:#1F6FB8;
  --good:#1E7A3C; --goodbg:#E4F3E8; --warn:#8F5200; --warnbg:#FFF1D6;
  --led-bg:#140605; --led:#FF3B2F;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#131110; --paper:#1C1917; --ink:#F2EEE9; --ink2:#C6BFB7; --muted:#8F877F; --rule:#2F2A26; --soft:#26221F;
    --accent:#E5675F; --accent-ink:#1C1917; --gold:#D9A441;
    --s1:#E5675F; --s2:#3D8BD6;
    --good:#72CC8E; --goodbg:#17301F; --warn:#F0B45A; --warnbg:#35270F;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#131110; --paper:#1C1917; --ink:#F2EEE9; --ink2:#C6BFB7; --muted:#8F877F; --rule:#2F2A26; --soft:#26221F;
  --accent:#E5675F; --accent-ink:#1C1917; --gold:#D9A441;
  --s1:#E5675F; --s2:#3D8BD6;
  --good:#72CC8E; --goodbg:#17301F; --warn:#F0B45A; --warnbg:#35270F;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.6 "Noto Sans TC",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--accent);color:var(--accent-ink);display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:10px 16px}
.brand{font:900 20px/1.2 "Noto Serif TC",serif;letter-spacing:.04em}
.brand small{font:500 12px "Noto Sans TC",sans-serif;opacity:.85;margin-left:8px;letter-spacing:0}
.top .sp{flex:1}
.top label{font-size:13px;display:flex;align-items:center;gap:6px}
.top select{background:var(--paper);color:var(--ink);border:0;border-radius:6px;padding:4px 8px}
.layout{display:grid;grid-template-columns:200px 1fr;gap:20px;max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:20px 48px}
nav{display:flex;flex-direction:column;gap:2px;position:sticky;top:72px;align-self:start}
.nav-i{display:flex;justify-content:space-between;align-items:center;gap:6px;text-align:left;background:none;border:0;padding:8px 12px;border-radius:6px;cursor:pointer;color:var(--ink2)}
.nav-i:hover{background:var(--soft)}
.nav-i.on{background:var(--paper);color:var(--accent);font-weight:700;box-shadow:inset 3px 0 0 var(--accent)}
.lk{font-size:11px;color:var(--muted);border:1px solid var(--rule);border-radius:4px;padding:0 5px;font-weight:400}
@media (max-width:760px){
  .layout{grid-template-columns:1fr}
  nav{position:static;flex-direction:row;overflow-x:auto;padding-bottom:4px}
  .nav-i{white-space:nowrap;flex:none}
  .nav-i.on{box-shadow:inset 0 -3px 0 var(--accent)}
}
main{min-width:0;display:flex;flex-direction:column;gap:16px}
h2{font:700 24px/1.3 "Noto Serif TC",serif;margin:0}
h3{font-size:16px;margin:0 0 10px}
.muted{color:var(--muted)}
.card{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:16px}
.card.ok{border-color:var(--good);background:var(--goodbg)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:900px){.row2{grid-template-columns:1fr}}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.tile{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.tile .k{font-size:13px;color:var(--ink2)}
.tile .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.tile .v small{font-size:13px;color:var(--ink2);font-weight:500;margin-left:2px}
.chip{align-self:flex-start;display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px}
.up{color:var(--good);background:var(--goodbg)} .dn{color:var(--warn);background:var(--warnbg)}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px}
.flow span{background:var(--soft);border-radius:6px;padding:4px 10px;font-size:13.5px}
.flow i{color:var(--muted);font-style:normal}
.stack{display:flex;flex-direction:column;gap:8px}
.btn{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:8px 14px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.sm{padding:2px 8px;font-size:13px}
.btn:focus-visible,.nav-i:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink2)}
.form .w2{grid-column:1/-1}
.form input,.form select,.form textarea{background:var(--bg);border:1px solid var(--rule);border-radius:6px;padding:8px 10px;font-size:15px;min-width:0}
.form .chk{flex-direction:row;align-items:center;gap:8px}
.act{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:6px}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
th{text-align:left;font-weight:500;color:var(--ink2);font-size:12.5px;border-bottom:1px solid var(--rule);padding:6px 8px;white-space:nowrap}
td{border-bottom:1px solid var(--soft);padding:7px 8px}
.n{text-align:right}
tr.void td{color:var(--muted);text-decoration:line-through}
td.act{margin:0;white-space:nowrap}
.log{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:4px;font-size:14px}
.locked{background:var(--paper);border:1px dashed var(--rule);border-radius:8px;padding:28px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.led{background:var(--led-bg);border-radius:8px;padding:18px 0;overflow:hidden;border:6px solid #2a2a2a}
.led-in{display:inline-block;white-space:nowrap;padding-left:100%;color:var(--led);font:700 30px/1.2 "Noto Sans TC",monospace;letter-spacing:.12em;text-shadow:0 0 6px rgba(255,59,47,.8);animation:run 14s linear infinite}
@keyframes run{to{transform:translateX(-100%)}}
@media (prefers-reduced-motion:reduce){.led-in{animation:none;padding-left:16px}}
.switch{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--soft);cursor:pointer}
.switch input{width:20px;height:20px;margin-top:3px;accent-color:var(--accent)}
.legend{display:flex;gap:16px;font-size:13px;color:var(--ink2);margin-bottom:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.s1{background:var(--s1)} .s2{background:var(--s2)}
.bar{display:grid;grid-template-columns:80px 1fr;gap:10px;align-items:center;padding:6px 0}
.bl{font-size:13.5px;color:var(--ink2);text-align:right}
.bt{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center}
.b{height:10px;border-radius:0 4px 4px 0;min-width:2px}
.bt em{font-style:normal;font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.cols{display:grid;grid-template-columns:repeat(12,1fr);gap:6px;height:180px;align-items:end}
.col{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px}
.cb{width:100%;background:var(--s1);border-radius:4px 4px 0 0;min-height:2px}
.col span{font-size:11px;color:var(--muted)}
.site{border-top:6px solid var(--accent)}
.site-h{font:900 22px "Noto Serif TC",serif;color:var(--accent)}
.doc{max-height:70vh;overflow:auto;line-height:1.85}
.doc h4{margin:18px 0 6px;font-size:15px;color:var(--accent)}
.doc p{margin:4px 0}
.doct{text-align:center;font:700 20px "Noto Serif TC",serif;margin:8px 0 4px}
.poster-prev{display:flex;justify-content:center;background:var(--soft)}
.poster-prev svg{max-width:100%;box-shadow:0 2px 12px rgba(0,0,0,.18)}
.chat{background:#8CABD9;display:flex;flex-direction:column;gap:8px}
.chat-h{font-weight:700;color:#fff;margin-bottom:4px}
.bub{max-width:85%;padding:8px 12px;border-radius:14px;font-size:14px;line-height:1.5;background:#fff;color:#1F1A17}
.bub.me{align-self:flex-end;background:#9DE693}
.bub.sys{background:#FFF7D6}
.hot{display:inline-block;background:var(--gold);color:var(--paper);font-size:11px;padding:0 6px;border-radius:4px}
.plans tr.price td{font-size:16px}
.plans th,.plans td{text-align:center}
.plans td:first-child{text-align:left}
.plans .cur{background:var(--soft);font-weight:700}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:8px;z-index:9;font-size:14px}
[hidden]{display:none!important}
#print{display:none}
@media print{
  body{background:#fff;color:#000}
  .top,.layout,#toast{display:none!important}
  #print{display:block}
  .rcpt{width:148mm;margin:0 auto;border:2px solid #8E1B16;padding:12mm;font-size:14pt}
  .rcpt h1{text-align:center;font:900 24pt "Noto Serif TC",serif;color:#8E1B16;margin:0}
  .rcpt>p{text-align:center;letter-spacing:.5em;margin:4px 0 12px}
  .rcpt th{width:28mm;color:#000;font-size:12pt}
  .rcpt td,.rcpt th{border-bottom:1px solid #ccc;padding:3mm 2mm}
  .rcpt .bless{text-align:center;margin-top:8mm;letter-spacing:.2em}
  .rcpt .sm{font-size:10pt;text-align:center}
  #print .doc{max-height:none;overflow:visible;border:0}
  .poster-print svg{width:100%;height:auto;display:block}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand" id="tname">宮廟雲</div>
  <span id="tbadge" style="font-size:13px;opacity:.9"></span>
  <span class="sp"></span>
  <label for="tier">展示方案
    <select id="tier">
      <option value="basic">入門</option><option value="standard">標準</option>
      <option value="deluxe">豪華</option><option value="flagship">旗艦</option>
    </select>
  </label>
</header>
<div class="layout">
  <nav id="nav" aria-label="功能"></nav>
  <main id="main"></main>
</div>
<div id="print"></div>
<div id="toast" hidden></div>
<script src="charter.js"></script>
<script src="poster.js"></script>
<script src="app.js"></script>
</body>
</html>
